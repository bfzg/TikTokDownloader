name: 构建可执行文件

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # ===========================================
  # Windows + macOS 构建
  # ===========================================
  build:
    name: 构建于 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            icon: --icon=./static/images/DouK-Downloader.icns
          - os: windows-latest
            icon: --icon=./static/images/DouK-Downloader.ico

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Windows 构建
      - name: 构建可执行文件 (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "DATE=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_ENV
          pyinstaller --onefile --noconsole --clean ${{ matrix.icon }} `
            --add-data "static;static" `
            --add-data "locale;locale" `
            --collect-all emoji `
            --name "DouK-Downloader" `
            main.py
        shell: pwsh

      # macOS 构建
      - name: 构建可执行文件 (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          pyinstaller --onefile --noconsole --clean ${{ matrix.icon }} \
            --add-data "static:static" \
            --add-data "locale:locale" \
            --collect-all emoji \
            --name "DouK-Downloader" \
            main.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DouK-Downloader_${{ runner.os }}_${{ runner.arch }}_${{ env.DATE }}
          path: dist/
          if-no-files-found: error

  # ===========================================
  # ✅ Linux 使用 manylinux 镜像构建（静态 + 兼容性）
  # ===========================================
  build-linux-compatible:
    name: 构建 Linux 兼容版 (manylinux)
    runs-on: ubuntu-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 使用 manylinux 构建
        run: |
          docker run --rm -v $PWD:/src quay.io/pypa/manylinux2014_x86_64 /bin/bash -c "
            set -e
            cd /src

            # 设置 Python 路径
            PYBIN=/opt/python/cp312-cp312/bin
            \$PYBIN/pip install --upgrade pip
            \$PYBIN/pip install pyinstaller auditwheel -r requirements.txt

            # 删除旧的 .spec 文件，避免影响参数
            rm -f DouK-Downloader.spec

            # 使用 PyInstaller 打包 (onefile，静态嵌入 Python)
            \$PYBIN/pyinstaller --onefile --noconsole --clean \
              --add-data 'static:static' \
              --add-data 'locale:locale' \
              --collect-all emoji \
              --name 'DouK-Downloader' \
              main.py

            # 使用 auditwheel 修复可执行文件，使其符合 manylinux2014 标准
            mkdir -p dist_fixed
            auditwheel repair dist/DouK-Downloader --plat manylinux2014_x86_64 -w dist_fixed
          "

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DouK-Downloader_linux_static
          path: dist_fixed/
          if-no-files-found: error

