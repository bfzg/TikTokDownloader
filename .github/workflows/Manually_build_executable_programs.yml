name: 构建可执行文件

on:
  workflow_dispatch:

jobs:
  build:
    name: 构建于 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]  # 添加 ubuntu-latest
        include:
          - os: macos-latest
            icon: --icon=./static/images/DouK-Downloader.icns
          - os: windows-latest
            icon: --icon=./static/images/DouK-Downloader.ico
          - os: ubuntu-latest
            icon: ""

    steps:
      - name: 签出存储库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖项
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 构建可执行文件 (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "DATE=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_ENV
          pyinstaller ${{ matrix.icon }} --add-data "static:static" --add-data "locale:locale" --collect-all emoji --name "DouK-Downloader" --clean --noconfirm main.py
        shell: pwsh

      - name: 构建可执行文件 (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          pyinstaller ${{ matrix.icon }} --add-data "static:static" --add-data "locale:locale" --collect-all emoji --name "DouK-Downloader" --clean --noconfirm main.py

      - name: 上传文件
        uses: actions/upload-artifact@v4
        with:
          name: DouK-Downloader_${{ runner.os }}_${{ runner.arch }}_${{ env.DATE }}
          path: dist/
          if-no-files-found: error